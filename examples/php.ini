; A cut-down php.ini
[PHP]
engine = On
short_open_tag = Off
memory_limit = 128M
max_execution_time = 30
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
display_errors = Off
extension_dir = "ext"
extension[] = curl
extension[] = mbstring
extension[] = openssl

[Date]
date.timezone = "Europe/London"

[mail function]
SMTP = localhost
smtp_port = 25
